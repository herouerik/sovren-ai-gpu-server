ollama:
  services:
    - name: "gpu-unified"
      port: 18434
      public_port: 11434
      gpu_ids: [1, 2, 3, 4, 5, 6]
      model: "qwen3-coder-next:Q4_K_M"
      description: "Unified 6x P100 pool — Ollama bound internally on `port`; `public_port` is what LAN clients connect to. Example assumes a reverse proxy sits in front (nginx, Caddy, a firewall rule, etc.) rejecting destructive methods like DELETE and forwarding everything else — this tool doesn't require one, but if you have one, point public_port at it."
      systemd_service: "ollama-unified.service"
    - name: "meta"
      port: 11435
      gpu_ids: [0]
      model: "qwen2.5-coder:7b"
      description: "GPU 0 (RTX 2080 Ti) meta pool — dedicated to prompt_insight.summarizer_service (see README \"Prompt insight\"), started 2026-09-11. Not customer-facing inference; kept isolated from the main pool (OLLAMA_VULKAN=false) specifically so it never competes with it."
      systemd_service: "ollama-meta.service"
      enabled: true

collectors:
  gpu_poll_interval_seconds: 2
  gpu_hardware_poll_interval_seconds: 60
  ollama_state_poll_interval_seconds: 5
  log_poll_interval_seconds: 1
  connections_poll_interval_seconds: 5

storage:
  db_path: "data/monitor.db"
  # Every table is bounded by construction (ring buffers / day-slots /
  # latest-only upserts) -- these settings size the bounds, they aren't a
  # cleanup-job interval. See src/storage.py module docstring.
  event_retention_days: 14        # patterns/alerts, load_cycles, benchmark_results
  connection_window_hours: 48
  connection_bucket_seconds: 30
  raw_ring_capacity: 100000       # requests, task_samples
  gpu_sample_memory_minutes: 240  # in-memory only, never persisted

patterns:
  latency_spike_threshold_ms: 5000
  swap_spike_multiplier: 5.0
  quota_exhaustion_keywords:
    - "quota exceeded"
    - "quota exhausted"
    - "rate limit"
    - "rate limited"
    - "too many requests"
    - "429"
  cpu_spillover_threshold_percent: 80
  baseline_window_minutes: 10
  # New thresholds, added for the failure modes actually diagnosed on this
  # box (reload storms, connection pileups, near-zero keep_alive, ctx churn).
  reload_storm_count_threshold: 5
  reload_storm_window_seconds: 300
  ctx_churn_distinct_values_threshold: 2
  ctx_churn_window_seconds: 900
  near_zero_keep_alive_seconds: 5
  connection_pileup_threshold: 6

server:
  host: "0.0.0.0"
  port: 8082
  cors_origins: ["*"]

# Recent-prompts panel: this monitor never sees request bodies on its own
# (Ollama's own logs never contain them, at any verbosity) -- it requires a
# reverse proxy to mirror a non-blocking copy of each request to
# /api/prompt_mirror. See README "Prompt insight" for the nginx `mirror`
# snippet. Off by default; harmless to leave on with no mirror configured
# (nothing ever arrives, so nothing is stored).
prompt_insight:
  enabled: true
  # Name of an entry in ollama.services to ask for a real ~8-word summary
  # instead of mechanical truncation -- "meta" here is this box's otherwise-
  # idle GPU 0, dedicated to this so it never competes with real inference.
  # Not running or not configured: every prompt just falls back to
  # mechanical truncation, silently, no error.
  summarizer_service: "meta"
  summarizer_timeout_seconds: 20
  fallback_max_words: 8
  fallback_max_chars: 100
  ring_capacity: 100
